<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:S;src:url(Sora-800.ttf);font-weight:800}*{margin:0}body{width:1500px;height:500px;background:#0b0c0b}canvas{display:block}</style></head><body><canvas id="cv" width="3000" height="1000" style="width:1500px;height:500px"></canvas><script>
const c=document.getElementById('cv').getContext('2d');c.scale(2,2);const W=1500,H=500;
let sd=11;const rnd=()=>((sd=(sd*16807)%2147483647)/2147483647);
function draw(){c.fillStyle='#0b0c0b';c.fillRect(0,0,W,H);
 // orb, sharp
 const N=1100,P=[];for(let i=0;i<N;i++){const y=rnd()*2-1,r=Math.sqrt(1-y*y),th=rnd()*6.283;P.push([Math.cos(th)*r,y,Math.sin(th)*r])}
 const cx=1320,cy=250,R=245,ry=.9,rx=.35,cY=Math.cos(ry),sY=Math.sin(ry),cX=Math.cos(rx),sX=Math.sin(rx);
 const pr=P.map(p=>{const X=p[0]*cY-p[2]*sY;let Z=p[0]*sY+p[2]*cY;const Y=p[1]*cX-Z*sX;Z=p[1]*sX+Z*cX;const s=2.6/(2.6+Z);return[cx+X*R*s,cy+Y*R*s,Z]});
 for(let i=0;i<N;i++){let b=[[9,0],[9,0]];for(let j=0;j<N;j++){if(i==j)continue;const d=(P[i][0]-P[j][0])**2+(P[i][1]-P[j][1])**2+(P[i][2]-P[j][2])**2;if(d<b[0][0]){b[1]=b[0];b[0]=[d,j]}else if(d<b[1][0])b[1]=[d,j]}for(const[,j]of b){if(j<i)continue;const A=pr[i],B=pr[j];c.strokeStyle=`rgba(236,233,224,${.07+(1-(A[2]+B[2])/2)*.28})`;c.lineWidth=.8;c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.stroke()}}
 for(const[x,y,z]of pr){c.fillStyle=`rgba(236,233,224,${.3+(1-z)*.55})`;c.beginPath();c.arc(x,y,1.3,0,6.283);c.fill()}
 for(let i=0;i<N;i+=37){const[x,y,z]=pr[i];if(z>.1)continue;c.fillStyle='#ff6a24';c.beginPath();c.arc(x,y,4.2,0,6.283);c.fill();c.strokeStyle='rgba(255,106,36,.55)';c.lineWidth=1.2;c.beginPath();c.arc(x,y,9,0,6.283);c.stroke()}
 // text
 c.textBaseline='alphabetic';c.font='800 66px S';c.letterSpacing='-2.4px';c.fillStyle='#ece9e0';c.fillText('Build an agent',500,212);c.fillText('in one sentence.',500,286);
 c.fillStyle='#ff6a24';c.fillText('Watch it trade.',500,360);
 c.fillStyle='#ff6a24';c.fillRect(500,128,56,6);}
document.fonts.load('800 66px S').then(()=>{draw();document.title='ready'});
</script></body></html>
